name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - name: Add provider CLIs to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop .#ci --command bash -euc '
            for cli; do
              path=$(command -v "$cli")
              "$path" --version
              dirname "$path" >> "$GITHUB_PATH"
            done
          ' -- codex opencode
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@1e96bd0df4241d3b5981cc508d74543db54c6c29
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@1e96bd0df4241d3b5981cc508d74543db54c6c29
