name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci-tools
      - name: Add provider CLIs to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop .#ci-tools --command bash -euc '
            for cli; do
              path=$(command -v "$cli")
              "$path" --version
              dirname "$path" >> "$GITHUB_PATH"
            done
          ' -- codex opencode
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit-sdk@91915accb5ae42bdaac11e5a5de181919c335965
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@91915accb5ae42bdaac11e5a5de181919c335965
